<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa người dùng</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --background-color: #f4f7f6;
            --card-background: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #e2e8f0;
            --success-color: #28a745;
            --danger-color: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .form-container {
            width: 100%;
            max-width: 580px;
            background: var(--card-background);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .form-header h2 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .form-header p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .form-body {
            padding: 30px;
        }

        /* Avatar Section */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .avatar-preview-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 15px;
        }

        .avatar-preview-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            background-color: #fff;
        }

        .avatar-inputs {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upload-btn-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #edf2f7;
            color: #4a5568;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px dashed #cbd5e0;
            transition: all 0.2s;
            text-align: center;
        }

        .upload-btn-label:hover {
            background-color: #e2e8f0;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .file-chosen-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--text-color);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        .form-control[readonly] {
            background-color: #f7fafc;
            color: #718096;
            cursor: not-allowed;
        }

        /* Radio Group */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .radio-label input[type="radio"] {
            cursor: pointer;
        }

        /* Actions */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-save:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .btn-cancel {
            background-color: #edf2f7;
            color: #4a5568;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <div class="form-header">
            <h2>Chỉnh sửa người dùng</h2>
            <p>Cập nhật thông tin tài khoản và ảnh đại diện</p>
        </div>

        <form class="form-body" 
              th:action="@{/users/edit/{id}(id=${user.id})}" 
              method="post" 
              enctype="multipart/form-data">

            <!-- Avatar Preview & Update -->
            <div class="avatar-section">
                <div class="avatar-preview-box">
                    <img id="avatarPreview" 
                         th:src="${user.avatar != null and !user.avatar.isEmpty() ? user.avatar : 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSzkzzbCAzkVsfPP_jfIGUBMR5K64qW6FiK4-03YBv2ou2Spx7NC8p12MpRjAjDLBKjt4_D626ve7zwQWllqi1YB1jj-kZiPOdoe7jcQ&s=10'}" 
                         alt="Avatar" 
                         class="avatar-preview-img" />
                </div>

                <div class="avatar-inputs">
                    <label for="avatarFileInput" class="upload-btn-label">
                        📷 Chọn ảnh đại diện từ máy tính
                    </label>
                    <input type="file" 
                           id="avatarFileInput" 
                           name="avatarFile" 
                           accept="image/*" 
                           style="display: none;" />
                    <div id="fileNameDisplay" class="file-chosen-name">Chưa chọn tệp ảnh mới</div>

                    <input type="text" 
                           id="avatarUrlInput" 
                           name="avatar" 
                           th:value="${user.avatar}" 
                           class="form-control" 
                           placeholder="Hoặc dán đường dẫn link ảnh (URL)..." />
                </div>
            </div>

            <!-- User ID -->
            <div class="form-group">
                <label>ID Người dùng:</label>
                <input type="text" th:value="${user.id}" readonly class="form-control" />
            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username">Tên tài khoản (Username):</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       th:value="${user.username}" 
                       required 
                       class="form-control" />
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Mật khẩu:</label>
                <input type="text" 
                       id="password" 
                       name="password" 
                       th:value="${user.password}" 
                       required 
                       class="form-control" />
            </div>

            <!-- Active Status -->
            <div class="form-group">
                <label>Trạng thái tài khoản:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" 
                               name="active" 
                               value="true" 
                               th:checked="${user.active != null and user.active}" />
                        Hoạt động
                    </label>
                    <label class="radio-label">
                        <input type="radio" 
                               name="active" 
                               value="false" 
                               th:checked="${user.active == null or !user.active}" />
                        Bị khóa
                    </label>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <a th:href="@{/users}" class="btn btn-cancel">Quay lại</a>
                <button type="submit" class="btn btn-save">Lưu thay đổi</button>
            </div>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('avatarFileInput');
        const urlInput = document.getElementById('avatarUrlInput');
        const preview = document.getElementById('avatarPreview');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        // Khi người dùng chọn file ảnh từ máy
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = 'Đã chọn: ' + file.name;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    preview.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Khi người dùng dán hoặc nhập URL ảnh
        urlInput.addEventListener('input', function(e) {
            const val = e.target.value.trim();
            if (val) {
                preview.src = val;
            }
        });
    </script>
</body>

</html>
